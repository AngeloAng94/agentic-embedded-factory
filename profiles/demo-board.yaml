# Profilo prodotto di ESEMPIO — tutti i valori sono fittizi.
# Nessun nome di cliente, scheda reale o progetto reale compare qui.
prodotto: DEMO-BOARD-01

chip:
  famiglia: stm32
  # dimensione in byte; più regioni RAM sono ammesse
  regioni:
    - { nome: FLASH, tipo: flash, origine: 0x08000000, dimensione: 2097152 }
    - { nome: RAM, tipo: ram, origine: 0x20000000, dimensione: 655360 }

build:
  sistema: cmake
  toolchain: arm-none-eabi-gcc
  comando: "cmake --build build"

flash:
  tool: STM32_Programmer_CLI
  interfaccia: swd

debug:
  gdb_server: st
  access_port: 0

# Fornitore del modello: llmClient (Ollama/OpenAI), claude-agent-sdk o fake.
llm:
  provider: llmClient

# Blocchi modificabili: // [AI_START_APP] … // [AI_END_APP]
ancore:
  - APP
  - LED

criteri:
  - seriale_contiene: "BOOT OK"
  - log_non_contiene:
      - HardFault
      - ERROR
  - test_su_target: pass

tentativi_max: 3
